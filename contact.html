<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contact · Ventura Dental Care</title>
<meta name="description" content="Book an appointment at Ventura Dental Care. Call, visit or send a request online.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
.ct{background:linear-gradient(180deg,var(--paper) 50%,#cfcfd2 80%,var(--dark-2));min-height:100vh;padding:120px var(--gut) 0;display:flex;flex-direction:column;--bg:var(--paper)}
.ct-grid{display:grid;grid-template-columns:1fr 1fr;gap:4vw}
.ct .lead{font-size:16px;font-weight:600;line-height:1.2;max-width:300px}
.ct-info{display:grid;gap:26px;font-size:13px;align-content:start}
.ct-info h5{font-size:11px;font-weight:500;opacity:.5;margin-bottom:6px}
.ct-info a,.ct-info b{font-size:20px;font-weight:600}
.ct-word{font-size:clamp(90px,15vw,280px);white-space:nowrap;margin-top:auto;padding-top:8vh;background:linear-gradient(90deg,#15151c 35%,#8a8a92 60%,#15151c 75%);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:.95}
.ct-map{background:var(--dark-2);padding:0 var(--gut) 40px}
.ct-map iframe{width:100%;height:60vh;border:0;border-radius:22px;filter:grayscale(1) invert(.92) contrast(.9)}
@media (max-width:900px){.ct-grid{grid-template-columns:1fr}}
</style>
</head>
<body data-page="contact" data-no-cta>

<main>
<section class="ct">
  <div class="ct-grid">
    <div class="ct-info" data-fade id="ctInfo"></div>
    <div data-fade>
      <p class="lead" id="form">Ready to book or just have questions? We're here for you.</p>
      <div class="form-slot" data-form="light"></div>
    </div>
  </div>
  <h1 class="ct-word serif">Book a call</h1>
</section>
<section class="ct-map"><iframe id="ctMap" title="Map" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe></section>
</main>

<script src="site.js"></script>
<script>
$('#ctInfo').innerHTML=`
  <div><h5>Call us</h5><a href="tel:${SITE.tel}">${SITE.phone}</a></div>
  <div><h5>Visit us</h5><b>${SITE.address.join('<br>')}</b></div>
  <div><h5>Opening hours</h5><dl class="hours" style="font-size:13px">${SITE.hours.map(h=>`<dt>${h[0]}</dt><dd>${h[1]}</dd>`).join('')}</dl></div>`;
$('#ctMap').src=`https://www.google.com/maps?q=${encodeURIComponent(SITE.mapQuery)}&output=embed`;
</script>
</body>
</html>
