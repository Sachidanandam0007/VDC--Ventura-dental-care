<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Services · Ventura Dental Care</title>
<meta name="description" content="Cosmetic, restorative, preventive and wellness dentistry at Ventura Dental Care.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="site.css">
<style>
/* hero */
.sv-hero{height:200vh;position:relative}
.sv-stage{background:#222}
.sv-stage>.media{position:absolute;inset:0;filter:grayscale(1)}
.sv-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.05) 35%,rgba(0,0,0,.4))}
.sv-white{position:absolute;inset:0;background:var(--light);opacity:0}
.sv-stats{position:absolute;left:var(--gut);top:40vh;display:flex;gap:28px;color:#fff;z-index:2}
.sv-stats div{display:flex;align-items:flex-end;gap:10px;padding-left:14px;border-left:1px solid rgba(255,255,255,.4)}
.sv-stats b{font:400 clamp(40px,3.4vw,58px)/.8 var(--serif)}
.sv-stats small{font-size:11px;font-weight:500;line-height:1.1;text-decoration:underline;text-underline-offset:3px}
.sv-title{position:absolute;left:0;right:0;bottom:4vh;display:flex;justify-content:space-between;padding:0 var(--gut);color:#fff;font-size:clamp(90px,14vw,250px);white-space:nowrap;z-index:2}
.sv-title span{will-change:transform}

/* intro */
.sv-intro{padding:140px var(--gut) 100px;text-align:center}
.sv-intro h2{font-size:clamp(38px,4.2vw,70px);max-width:900px;margin:0 auto;line-height:.98}
.sv-intro .cols{display:grid;grid-template-columns:1fr 1fr;gap:4vw;margin-top:90px;text-align:left}
.sv-intro .cols div{grid-column:2;font-size:13px;line-height:1.55;max-width:460px}
.sv-intro .cols p+p{margin-top:14px;opacity:.6}

/* key indicators */
.sv-ind{position:relative;height:130vh;overflow:hidden}
.ind{position:absolute;font-weight:600;line-height:1.15;text-align:center;will-change:transform}
.sv-ind h2{position:absolute;left:0;right:0;bottom:-.08em;display:flex;justify-content:space-between;padding:0 var(--gut);font-size:clamp(70px,10vw,180px);white-space:nowrap}

/* band */
.sv-band{position:relative;height:110vh;overflow:hidden;color:#fff}
.sv-band>.media{position:absolute;inset:0;filter:grayscale(1)}
.sv-band::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(180deg,var(--light) 0%,rgba(236,235,236,0) 25%,rgba(0,0,0,0) 60%,rgba(22,22,30,.6))}
.sv-band p{position:absolute;z-index:2;left:var(--gut);top:40px;font-size:11px;color:var(--ink);max-width:180px}
.sv-band h2{position:absolute;z-index:2;left:0;right:0;bottom:-.1em;display:flex;justify-content:space-between;padding:0 var(--gut);font-size:clamp(90px,15vw,270px);white-space:nowrap}

/* treatment cards */
.sv-cards{padding:100px var(--gut) 140px}
.cgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.ccard{background:var(--light);color:var(--ink);border-radius:20px;padding:18px;text-align:center;display:flex;flex-direction:column;transition:transform .5s var(--ease)}
.ccard:hover{transform:translateY(-8px)}
.ccard h3{font-size:clamp(26px,2.2vw,38px);min-height:2em;display:grid;place-items:center}
.ccard .media{aspect-ratio:4/3;border-radius:14px;margin:14px 0 20px;filter:grayscale(1);transition:filter .5s}
.ccard:hover .media{filter:none}
.ccard p{font-size:12px;opacity:.6;line-height:1.45;padding:0 8px}
.ccard .ulink{margin-top:auto;padding-top:24px}

/* gallery */
.sv-gal{padding:120px 0 140px;overflow:hidden}
.gal-h{font-size:clamp(90px,13vw,240px);padding:0 var(--gut);position:relative}
.gal-h .g1{display:block;text-align:center;padding-left:20vw}
.gal-h .g2{display:flex;justify-content:space-between;align-items:center;margin-top:-.04em}
.gal-h small{font:600 11px/1.2 var(--sans);letter-spacing:0;max-width:110px}
.strip{margin-top:60px;--mq-speed:50s}
.strip .media{width:300px;height:210px;flex:none;margin-right:12px;border-radius:6px}
.strip:hover{animation-play-state:paused}

@media (max-width:900px){
  .sv-title{flex-direction:column;bottom:6vh}
  .sv-intro .cols{grid-template-columns:1fr}.sv-intro .cols div{grid-column:1}
  .ind{font-size:12px!important}
  .sv-ind h2,.sv-band h2{flex-direction:column;bottom:0}
  .cgrid{grid-template-columns:1fr 1fr}
  .gal-h .g1{padding-left:0}
  .strip .media{width:220px;height:160px}
}
</style>
</head>
<body data-page="service" data-header="dark">

<main>
<section class="sv-hero" id="svHero">
  <div class="sticky sv-stage">
    <div class="media" id="svImg"></div>
    <div class="sv-shade"></div>
    <div class="sv-white" id="svWhite"></div>
    <div class="sv-stats"><div><b id="svCount">4</b><small>Expert<br>Treatments</small></div><div><b>8k+</b><small>Happy<br>Patients</small></div></div>
    <h1 class="sv-title serif"><span id="svT1"></span><span id="svT2"></span></h1>
  </div>
</section>

<section class="sv-intro">
  <h2 class="serif" id="svHeading" data-fade></h2>
  <div class="cols"><div id="svIntro" data-fade></div></div>
</section>

<section class="sv-ind" id="svInd">
  <div id="indWords"></div>
  <h2 class="serif"><span>Key indicators</span><em>to consider</em></h2>
</section>

<section class="sv-band">
  <div class="media" id="bandImg"></div>
  <p>Treatments designed to restore balance, brightness and confidence to your smile.</p>
  <h2 class="serif"><span>Ventura</span><em>Solutions</em></h2>
</section>

<section class="sv-cards dark">
  <div class="cgrid" id="cgrid"></div>
</section>

<section class="appt">
  <div class="media bw" data-img="hero-poster.jpg" data-label="Team photo"></div>
  <h2 class="serif" data-fade>Schedule your appointment<br>with our doctors <em>today!</em></h2>
</section>

<section class="sv-gal dark">
  <h2 class="gal-h serif" data-fade><span class="g1">Patient</span><span class="g2"><span>Transformation</span><small>The impact of expert dentistry:</small><span>Gallery</span></span></h2>
  <!-- Replace with real before/after photos when available -->
  <div class="strip marquee" id="strip"></div>
</section>

<section class="faq dark">
  <h2 class="serif" data-fade>FAQ</h2>
  <div><div data-faq="home"></div><a href="faq.html" class="pill light arrow">All Answers <span class="ico">›</span></a></div>
</section>
</main>

<script src="site.js"></script>
<script>
const slug=new URLSearchParams(location.search).get('s');
const S=SERVICES.find(s=>s.slug===slug)||SERVICES[0];
document.title=`${S.name} · ${SITE.name}`;

$('#svImg').dataset.img=S.img; $('#svImg').dataset.label='Service photo';
$('#svT1').innerHTML=`<em>${S.t1}</em>`; $('#svT2').textContent=S.t2;
$('#svCount').textContent=S.cards.length;
$('#svHeading').textContent=S.heading;
$('#svIntro').innerHTML=S.intro.map(p=>`<p>${p}</p>`).join('');
$('#bandImg').dataset.img=S.cards[2][2];

/* floating indicator words: position, size and parallax speed */
const SPOTS=[[14,30,13,-.6],[46,20,16,.4],[72,34,12,-.3],[88,22,9,.8],[24,58,11,.5],[60,52,14,-.5]];
$('#indWords').innerHTML=S.indicators.map((t,i)=>{const[x,y,f,sp]=SPOTS[i%SPOTS.length];
  return `<span class="ind" data-sp="${sp}" style="left:${x}%;top:${y}%;font-size:${f}px;max-width:${f*11}px;transform:translateX(-50%)">${t}</span>`;}).join('');

$('#cgrid').innerHTML=S.cards.map(([n,t,img],i)=>`
  <div class="ccard" data-fade style="transition-delay:${i*80}ms">
    <h3 class="serif">${n}</h3>${mediaDiv(img)}<p>${t}</p><a class="ulink" href="contact.html">Learn More</a>
  </div>`).join('');

const GALLERY=['service-cosmetic.jpg','tech-1.jpg','service-restorative.jpg','smile.jpg','service-preventive.jpg','tech-4.jpg','mission.jpg','service-wellness.jpg'];
$('#strip').innerHTML=[...GALLERY,...GALLERY].map(g=>mediaDiv(g)).join('');

onScroll((y,vh)=>{
  /* hero: title halves drift apart and the photo fades to white */
  const p=progressOf($('#svHero'));
  $('#svT1').style.transform=`translateX(${-ease(p)*30}vw)`;
  $('#svT2').style.transform=`translateX(${ease(p)*30}vw)`;
  $('#svWhite').style.opacity=range(p,.25,1)*.9;
  /* indicators float at different speeds */
  const r=$('#svInd').getBoundingClientRect();
  if(r.top<vh&&r.bottom>0){const k=(r.top+r.height/2-vh/2);
    $$('.ind').forEach(el=>el.style.transform=`translate(-50%,${k*el.dataset.sp*.5}px)`);}
});
</script>
</body>
</html>
